<!doctype html>
<html lang="es" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm4 4v8l8-4-8-4z'/></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#06b6d4" />
    <!-- Instalable en iOS: icono táctil y modo de app a pantalla completa. -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HydraCut" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) resolves to
         0 and the iOS safe areas are inert (audit UI-04). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="HydraCut Studio — editor de vídeo multitrack 100% en tu navegador: transiciones, waveforms y exportación MP4. Sin servidor, sin subidas."
    />
    <link rel="canonical" href="https://hydracut.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hydracut.pages.dev/" />
    <meta property="og:title" content="HydraCut — editor de vídeo multitrack en el navegador" />
    <meta
      property="og:description"
      content="HydraCut Studio — editor de vídeo multitrack 100% en tu navegador: transiciones, waveforms y exportación MP4. Sin servidor, sin subidas."
    />
    <title>HydraCut — Video Studio | HydraApps</title>
    <!--
      B-10: NO external font requests.
      The app promises "100 % privado en tu navegador" and "sin servidor": a
      stylesheet from fonts.googleapis.com would leak the IP address of the
      user to Google on EVERY load, block the first paint and break the
      offline promise. The typographic stack is resolved LOCALLY: "Inter" and
      "JetBrains Mono" are used only when they are installed on the machine of
      the user, otherwise the system font stack is used.
    -->
    <style>
      html body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      }
      html body .font-mono,
      html body .font-mono * {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas,
          'Liberation Mono', 'Courier New', monospace;
      }
    </style>
  </head>
  <body class="h-full bg-dark-950 text-slate-100 antialiased overflow-hidden select-none">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
