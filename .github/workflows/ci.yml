name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel superseded runs of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  browser-e2e:
    name: Browser E2E (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (ffprobe for the export checks)
        # Los checks de exportación inspeccionan el MP4 con ffprobe/ffmpeg:
        # sin ellos la suite fallaba con `spawnSync ffprobe ENOENT`. Se muestra
        # la versión para que un futuro fallo diga si estaban presentes.
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          which ffprobe ffmpeg
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Browser E2E (puppeteer + dev server)
        # The harness resolves the binary via HYDRA_CHROME_PATH, then the
        # usual locations, then a PATH lookup (see `resolveChromePath()` in
        # src/tests/browser/browser-harness.mjs). The explicit export below
        # makes the log show exactly which Chrome ran the suite.
        run: |
          export HYDRA_CHROME_PATH="$(which google-chrome-stable || which google-chrome || which chromium)"
          echo "Using Chrome at $HYDRA_CHROME_PATH"
          "$HYDRA_CHROME_PATH" --version
          npm run test:browser
